[package]
name = "niri-whichkey"
version = "0.1.0"
edition = "2021"

[dependencies]
evdev = "0.13"
kdl = { version = "6.7", features = ["v1-fallback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
fontdue = "0.9"
tiny-skia = "0.12"
smithay-client-toolkit = "0.21"
calloop-wayland-source = "0.4"
wayland-client = "0.31"
calloop = "0.14"
nix = { version = "0.29", features = ["poll", "fs", "user"] }
